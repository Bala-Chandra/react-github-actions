name: "first workflow"
on: 
    push:
    pull_request: # ← no filter = ALL branches
        branches: 
            - main
            - dev
            - qa
jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v4
              
            - name: "Setup Node.js"
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "npm"

            - name: "Install dependencies"
              run: npm ci

            - name: run ESlint 
              run: npm run lint

            - name: run test cases
              run: npm run test
            
            - name: make react build
              run: npm run build