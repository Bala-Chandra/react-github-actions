name: "first workflow"
on: 
    push:
    pull_request: # ← no filter = ALL branches
        branches: 
            - main
            - dev
            - qa
jobs:
    lint-job:
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v4
              
            - name: "Setup Node.js"
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "npm"

            - name: "Install dependencies"
              run: npm ci

            - name: run ESlint 
              run: npm run lint
    test-job:
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout"
              uses: actions/checkout@v4
              
            - name: "Setup Node.js"
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "npm"

            - name: "Install dependencies"
              run: npm ci

            - name: run test cases
              run: npm run test

    build-job: 
        needs: [lint-job, test-job]
        runs-on: ubuntu-latest

        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


        steps:
            - name: "Checkout"
              uses: actions/checkout@v4
              
            - name: "Setup Node.js"
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "npm"

            - name: "Install dependencies"
              run: npm ci
            
            - name: make react build
              run: npm run build

            - name: "Upload build artifacts"
              uses: actions/upload-artifact@v4
              with:
                name: react-build
                path: dist/
                retention-days: 7
            - name: "Install Vercel CLI"
              run: npm install -g vercel

            - name: "deploy to vercel"
              run: vercel deploy dist --prod --yes --token ${{ secrets.VERCEL_TOKEN }}         
